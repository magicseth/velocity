name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: CODE_SIGN_IDENTITY=- bash scripts/build.sh
      - run: swift test -Xswiftc -DVELOCITY_EXPERIMENTAL
      - run: VELOCITY_EXPERIMENTAL=1 CODE_SIGN_IDENTITY=- bash scripts/build.sh
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
  browser-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test browser-companion/tests/*.test.js
